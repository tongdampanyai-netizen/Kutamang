<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สลิปเข้า — KBank (ตัวอย่าง)</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Kanit',sans-serif;background:#f3f4f6;display:flex;align-items:flex-start;justify-content:center;padding:20px}
    .page{display:flex;gap:20px}
    .panel{background:#fff;padding:14px;border-radius:10px;box-shadow:0 8px 30px rgba(2,6,23,.06)}
    canvas{display:block;border-radius:6px;border:1px solid #e6e9ee}
    .controls{width:360px}
    label{display:block;font-size:13px;margin:8px 0 6px;color:#333}
    input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;font-size:15px}
    button{background:#0b61ff;color:#fff;border:0;cursor:pointer;margin-top:8px}
    .row{display:flex;gap:8px}
    .small{width:48%}
    .muted{font-size:13px;color:#666;margin-top:6px}
    .note{font-size:13px;color:#111;margin-top:12px}
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <canvas id="canvas" width="732" height="1280" aria-label="สลิปตัวอย่าง"></canvas>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button id="downloadBtn">ดาวน์โหลดเป็นรูป</button>
        <button id="toggleInfo">แสดง/ซ่อน ข้อมูล</button>
      </div>
    </div>

    <div class="panel controls">
      <h3>ตั้งค่าสลิป (KBank)</h3>

      <label>ยอดเงิน</label>
      <input id="amount" value="30,650.00">

      <label>ชื่อผู้รับ</label>
      <input id="name" value="นาย สมชาย ใจดี">

      <label>บัญชี (เลขที่)</label>
      <input id="account" value="xxx-x-x5529-x">

      <label>วันที่และเวลา</label>
      <input id="datetime" type="datetime-local">

      <div class="row" style="margin-top:8px">
        <input id="fontScale" class="small" type="number" value="1" step="0.05">
        <input id="textColor" class="small" type="color" value="#000000">
      </div>

      <p class="muted">หมายเหตุ: ใส่ภาพพื้นหลังเป็น <code>assets/background-slip.png</code> (สลิปกสิกร) และโลโก้ <code>assets/logo-kbank.png</code></p>
    </div>
  </div>

<script>
/* --- canvas renderer --- */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const bg = new Image();
const logo = new Image();
bg.src = 'assets/background-slip.png';      // **ต้องมีไฟล์นี้**
logo.src = 'assets/logo-kbank.png';         // **ต้องมีไฟล์นี้**

const inputs = ['amount','name','account','datetime','fontScale','textColor'];
function getVal(id){ return document.getElementById(id).value; }

let loaded = 0;
[bg,logo].forEach(i=>{
  i.onload = ()=>{ loaded++; if(loaded===2) draw(); };
  i.onerror = ()=>{ loaded++; if(loaded===2) draw(); };
});

function draw(){
  // clear
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background
  if(bg.complete && bg.naturalWidth){
    ctx.drawImage(bg,0,0,canvas.width,canvas.height);
  } else {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#f5f7fb'; ctx.fillRect(40,120,canvas.width-80,900);
  }

  // draw logo (top-right)
  const logoW = 180;
  const logoH = logo.naturalHeight ? logoW * (logo.naturalHeight/logo.naturalWidth) : 60;
  ctx.drawImage(logo, canvas.width - 60 - logoW, 40, logoW, logoH);

  // text
  const scale = parseFloat(getVal('fontScale')) || 1;
  ctx.fillStyle = getVal('textColor') || '#000';
  ctx.textBaseline = 'top';

  // amount (big)
  ctx.font = `${48*scale}px Kanit, sans-serif`;
  ctx.fillText((getVal('amount') || ''), 80, 320);

  // name
  ctx.font = `${22*scale}px Kanit, sans-serif`;
  ctx.fillText(getVal('name') || '', 80, 400);

  // account line
  ctx.font = `${20*scale}px Kanit, sans-serif`;
  ctx.fillText('บัญชี: ' + (getVal('account') || ''), 80, 440);

  // date/time
  let dt = getVal('datetime');
  let dtText = '';
  if(dt){
    const d = new Date(dt);
    dtText = d.toLocaleDateString('th-TH') + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  } else {
    const d = new Date();
    dtText = d.toLocaleDateString('th-TH') + ' ' + d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  }
  ctx.font = `${18*scale}px Kanit, sans-serif`;
  ctx.fillText(dtText, 80, 480);
}

/* update on input */
inputs.forEach(id=>{
  const el = document.getElementById(id);
  if(el) el.addEventListener('input', draw);
});

/* download */
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const data = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = data;
  a.download = 'slip-kbank.png';
  a.click();
});

/* toggle info visibility (simple example) */
let infoVisible = true;
document.getElementById('toggleInfo').addEventListener('click', ()=>{
  infoVisible = !infoVisible;
  // hide/show by drawing blank fields (for demo)
  if(!infoVisible){
    document.getElementById('amount').dataset._v = document.getElementById('amount').value; document.getElementById('amount').value='';
    document.getElementById('name').dataset._v = document.getElementById('name').value; document.getElementById('name').value='';
    document.getElementById('account').dataset._v = document.getElementById('account').value; document.getElementById('account').value='';
  } else {
    ['amount','name','account'].forEach(id=>{
      if(document.getElementById(id).dataset._v) document.getElementById(id).value = document.getElementById(id).dataset._v;
    });
  }
  draw();
});

// initial draw after a small timeout in case fonts load
setTimeout(()=>{ draw(); }, 300);
</script>
</body>
</html>
